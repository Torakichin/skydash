<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fly Shark (フライシャーク)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1b2a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 854px;
            background-color: #000;
            box-shadow: 0 0 35px rgba(0, 180, 216, 0.4);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        .sound-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #0077b6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="soundToggle" class="sound-btn">🔊</div>
</div>

<script>
// Web Audio API による効果音生成
class SoundSystem {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.initialized = true;
        } catch (e) {
            console.error("Web Audio API Error", e);
        }
    }

    playSwim() {
        if (!this.initialized || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
    }

    playEat() {
        if (!this.initialized || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.06); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.12); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    }

    playHit() {
        if (!this.initialized || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
    }
}

// エフェクトパーティクル
class Particle {
    constructor(x, y, vx, vy, color, size, life, type = 'circle', text = '') {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.maxLife = life;
        this.life = life;
        this.type = type;
        this.text = text;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
    }

    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;

        if (this.type === 'bubble') {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.stroke();
        } else if (this.type === 'text') {
            ctx.fillStyle = this.color;
            ctx.font = `bold ${Math.floor(this.size)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 4;
            ctx.fillText(this.text, this.x, this.y);
        } else {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

// サメ（プレイヤー）
class Shark {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 20;
        this.vy = 0;
        this.gravity = 900;
        this.swimImpulse = -320;
        this.angle = 0;
        this.mouthOpen = 0;
    }

    reset(x, y) {
        this.x = x;
        this.y = y;
        this.vy = 0;
        this.angle = 0;
    }

    swim(sound) {
        this.vy = this.swimImpulse;
        this.mouthOpen = 0.5;
        sound.playSwim();
    }

    update(dt) {
        this.vy += this.gravity * dt;
        this.y += this.vy * dt;

        // 速度に応じた角度回転
        this.angle = Math.max(-0.6, Math.min(0.7, this.vy * 0.002));

        if (this.mouthOpen > 0) {
            this.mouthOpen -= dt * 2;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // 尾ヒレ
        ctx.fillStyle = '#0077b6';
        ctx.beginPath();
        ctx.moveTo(-18, 0);
        ctx.lineTo(-32, -12 + Math.sin(Date.now() * 0.02) * 4);
        ctx.lineTo(-26, 0);
        ctx.lineTo(-32, 12 - Math.sin(Date.now() * 0.02) * 4);
        ctx.closePath();
        ctx.fill();

        // 背ヒレ
        ctx.beginPath();
        ctx.moveTo(-4, -10);
        ctx.lineTo(2, -26);
        ctx.lineTo(12, -8);
        ctx.closePath();
        ctx.fill();

        // 体（背側）
        ctx.fillStyle = '#0096c7';
        ctx.beginPath();
        ctx.ellipse(0, 0, 24, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // お腹（白い部分）
        ctx.fillStyle = '#e0f7fa';
        ctx.beginPath();
        ctx.ellipse(2, 4, 18, 8, 0, 0, Math.PI);
        ctx.fill();

        // 胸ヒレ
        ctx.fillStyle = '#0077b6';
        ctx.beginPath();
        ctx.moveTo(2, 4);
        ctx.lineTo(-6, 16);
        ctx.lineTo(8, 6);
        ctx.closePath();
        ctx.fill();

        // 目
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(12, -4, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#03045e';
        ctx.beginPath();
        ctx.arc(13, -4, 2, 0, Math.PI * 2);
        ctx.fill();

        // 口 & 歯
        ctx.fillStyle = '#d90429';
        ctx.beginPath();
        const mouthGap = 3 + this.mouthOpen * 8;
        ctx.moveTo(14, 2);
        ctx.lineTo(24, 2 + mouthGap);
        ctx.lineTo(16, 8);
        ctx.closePath();
        ctx.fill();

        // 鋭い歯
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(16, 2); ctx.lineTo(18, 5); ctx.lineTo(20, 2);
        ctx.fill();

        // 泡（スクリュー効果）
        if (Math.random() < 0.3) {
            ctx.restore();
            return {
                bubble: new Particle(
                    this.x - 28, this.y + (Math.random() - 0.5) * 8,
                    -80, (Math.random() - 0.5) * 20,
                    '#fff', Math.random() * 3 + 2, 0.5, 'bubble'
                )
            };
        }

        ctx.restore();
        return null;
    }
}

// 障害物（海底岩柱 / 水中機雷）
class Obstacle {
    constructor(x, gapY, gapHeight, width) {
        this.x = x;
        this.gapY = gapY;
        this.gapHeight = gapHeight;
        this.width = width;
        this.passed = false;
    }

    update(dt, speed) {
        this.x -= speed * dt;
    }

    draw(ctx, canvasHeight) {
        ctx.save();

        // 岩のグラデーション
        const grad = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
        grad.addColorStop(0, '#2b2d42');
        grad.addColorStop(0.5, '#4a4e69');
        grad.addColorStop(1, '#1d1e2c');

        ctx.fillStyle = grad;
        ctx.strokeStyle = '#9a8c98';
        ctx.lineWidth = 3;

        // 上の岩柱
        const topHeight = this.gapY - this.gapHeight / 2;
        ctx.beginPath();
        ctx.fillRect(this.x, 0, this.width, topHeight);
        ctx.strokeRect(this.x, -5, this.width, topHeight + 5);

        // 下の岩柱
        const bottomTop = this.gapY + this.gapHeight / 2;
        const bottomHeight = canvasHeight - bottomTop;
        ctx.beginPath();
        ctx.fillRect(this.x, bottomTop, this.width, bottomHeight);
        ctx.strokeRect(this.x, bottomTop, this.width, bottomHeight + 5);

        // 機雷飾り（中央付近）
        ctx.fillStyle = '#ef233c';
        ctx.beginPath();
        ctx.arc(this.x + this.width / 2, topHeight - 12, 8, 0, Math.PI * 2);
        ctx.arc(this.x + this.width / 2, bottomTop + 12, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    checkCollision(shark) {
        const topHeight = this.gapY - this.gapHeight / 2;
        const bottomTop = this.gapY + this.gapHeight / 2;

        if (shark.x + shark.radius > this.x && shark.x - shark.radius < this.x + this.width) {
            if (shark.y - shark.radius < topHeight || shark.y + shark.radius > bottomTop) {
                return true;
            }
        }
        return false;
    }
}

// ターゲット（小魚）
class FishItem {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 12;
        this.eaten = false;
        this.swimAnim = Math.random() * 10;
    }

    update(dt, speed) {
        this.x -= speed * dt;
        this.swimAnim += dt * 8;
        this.y += Math.sin(this.swimAnim) * 0.5;
    }

    draw(ctx) {
        if (this.eaten) return;
        ctx.save();
        ctx.translate(this.x, this.y);

        // 小魚の体
        ctx.fillStyle = '#ffb703';
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // 尾ヒレ
        ctx.fillStyle = '#fb8500';
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(-14, -5);
        ctx.lineTo(-14, 5);
        ctx.closePath();
        ctx.fill();

        // 目
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(4, -2, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    checkEat(shark) {
        if (this.eaten) return false;
        const dist = Math.hypot(shark.x - this.x, shark.y - this.y);
        if (dist < shark.radius + this.radius + 6) {
            this.eaten = true;
            return true;
        }
        return false;
    }
}

// メインゲーム管理
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sound = new SoundSystem();

        this.width = 400;
        this.height = 700;

        this.state = 'TITLE'; // TITLE, PLAYING, GAMEOVER
        this.score = 0;
        this.fishEaten = 0;
        this.bestScore = parseInt(localStorage.getItem('flyshark_best') || '0', 10);

        this.shark = new Shark(100, 350);
        this.obstacles = [];
        this.fishes = [];
        this.particles = [];
        this.bgBubbles = [];

        this.spawnTimer = 0;
        this.obstacleSpeed = 190;

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupInputs();

        // 背景泡初期化
        for (let i = 0; i < 25; i++) {
            this.bgBubbles.push({
                x: Math.random() * this.width,
                y: Math.random() * this.height,
                size: Math.random() * 4 + 1,
                speed: Math.random() * 30 + 10
            });
        }

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    }

    resize() {
        const container = document.getElementById('game-container');
        const dpr = window.devicePixelRatio || 1;
        const rect = container.getBoundingClientRect();

        this.canvas.width = rect.width * dpr;
        this.canvas.height = rect.height * dpr;

        this.scale = rect.width / this.width;
        this.ctx.setTransform(dpr * this.scale, 0, 0, dpr * this.scale, 0, 0);
    }

    setupInputs() {
        const soundBtn = document.getElementById('soundToggle');
        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.sound.muted = !this.sound.muted;
            soundBtn.textContent = this.sound.muted ? '🔇' : '🔊';
        });

        const handleAction = (e) => {
            if (e.target.id === 'soundToggle') return;
            this.sound.init();

            if (this.state === 'TITLE') {
                this.startGame();
            } else if (this.state === 'PLAYING') {
                this.shark.swim(this.sound);
            } else if (this.state === 'GAMEOVER') {
                this.resetGame();
                this.startGame();
            }
        };

        window.addEventListener('pointerdown', handleAction);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleAction(e);
            }
        });
    }

    resetGame() {
        this.score = 0;
        this.fishEaten = 0;
        this.obstacleSpeed = 190;
        this.obstacles = [];
        this.fishes = [];
        this.particles = [];
        this.shark.reset(100, 350);
        this.spawnTimer = 0;
    }

    startGame() {
        this.state = 'PLAYING';
        this.shark.swim(this.sound);
    }

    spawnObstacle() {
        const gapHeight = Math.max(145, 195 - this.score * 2);
        const minGapY = 120 + gapHeight / 2;
        const maxGapY = this.height - 120 - gapHeight / 2;
        const gapY = Math.random() * (maxGapY - minGapY) + minGapY;

        const obs = new Obstacle(this.width + 20, gapY, gapHeight, 60);
        this.obstacles.push(obs);

        // 隙間に確率で小魚を生成
        if (Math.random() < 0.75) {
            this.fishes.push(new FishItem(this.width + 50, gapY + (Math.random() - 0.5) * 40));
        }
    }

    update(dt) {
        dt = Math.min(dt, 0.05);

        // 背景の泡アニメーション
        this.bgBubbles.forEach(b => {
            b.y -= b.speed * dt;
            if (b.y < -10) {
                b.y = this.height + 10;
                b.x = Math.random() * this.width;
            }
        });

        // パーティクル更新
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].life <= 0) this.particles.splice(i, 1);
        }

        if (this.state === 'PLAYING') {
            const effect = this.shark.draw(this.ctx);
            if (effect && effect.bubble) {
                this.particles.push(effect.bubble);
            }
            this.shark.update(dt);

            // 画面外（天井・底）の衝突
            if (this.shark.y - this.shark.radius <= 0 || this.shark.y + this.shark.radius >= this.height) {
                this.gameOver();
            }

            // スピードの上昇
            this.obstacleSpeed = 190 + Math.min(150, this.score * 3);

            // 障害物の生成タイマー
            this.spawnTimer += dt;
            if (this.spawnTimer > 1.65 - Math.min(0.5, this.score * 0.015)) {
                this.spawnTimer = 0;
                this.spawnObstacle();
            }

            // 障害物の更新・判定
            for (let i = this.obstacles.length - 1; i >= 0; i--) {
                const obs = this.obstacles[i];
                obs.update(dt, this.obstacleSpeed);

                if (obs.checkCollision(this.shark)) {
                    this.gameOver();
                }

                if (!obs.passed && obs.x + obs.width < this.shark.x) {
                    obs.passed = true;
                    this.score += 1;
                }

                if (obs.x < -obs.width - 20) {
                    this.obstacles.splice(i, 1);
                }
            }

            // 小魚の更新・獲得判定
            for (let i = this.fishes.length - 1; i >= 0; i--) {
                const fish = this.fishes[i];
                fish.update(dt, this.obstacleSpeed);

                if (fish.checkEat(this.shark)) {
                    this.fishEaten++;
                    this.score += 5;
                    this.sound.playEat();

                    // 獲得演出
                    this.particles.push(new Particle(fish.x, fish.y, 0, -50, '#ffea00', 20, 0.7, 'text', '+5'));
                    for (let p = 0; p < 6; p++) {
                        this.particles.push(new Particle(
                            fish.x, fish.y,
                            (Math.random() - 0.5) * 120, (Math.random() - 0.5) * 120,
                            '#ffb703', Math.random() * 4 + 2, 0.4, 'circle'
                        ));
                    }
                    this.fishes.splice(i, 1);
                } else if (fish.x < -30) {
                    this.fishes.splice(i, 1);
                }
            }
        }
    }

    gameOver() {
        if (this.state === 'GAMEOVER') return;
        this.state = 'GAMEOVER';
        this.sound.playHit();

        // 水しぶきエフェクト
        for (let i = 0; i < 20; i++) {
            this.particles.push(new Particle(
                this.shark.x, this.shark.y,
                (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200,
                '#ef233c', Math.random() * 5 + 3, 0.8, 'circle'
            ));
        }

        if (this.score > this.bestScore) {
            this.bestScore = this.score;
            localStorage.setItem('flyshark_best', this.bestScore.toString());
        }
    }

    drawBackground() {
        const ctx = this.ctx;
        // 深海グラデーション
        const grad = ctx.createLinearGradient(0, 0, 0, this.height);
        grad.addColorStop(0, '#00b4d8');
        grad.addColorStop(0.4, '#0077b6');
        grad.addColorStop(1, '#03045e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, this.width, this.height);

        // 背景の光線
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.beginPath();
        ctx.moveTo(50, 0); ctx.lineTo(150, this.height); ctx.lineTo(80, this.height); ctx.lineTo(0, 0);
        ctx.moveTo(200, 0); ctx.lineTo(350, this.height); ctx.lineTo(280, this.height); ctx.lineTo(120, 0);
        ctx.fill();
        ctx.restore();

        // 泡
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        this.bgBubbles.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    drawHUD() {
        const ctx = this.ctx;
        ctx.save();

        // スコア表示
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 38px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 6;
        ctx.fillText(`${this.score}`, this.width / 2, 65);

        // 食べた小魚アイコン＆数
        ctx.fillStyle = '#ffb703';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`🐟 x ${this.fishEaten}`, 20, 40);

        ctx.restore();
    }

    drawTitleScreen() {
        const ctx = this.ctx;
        ctx.save();

        ctx.fillStyle = 'rgba(3, 4, 94, 0.75)';
        ctx.fillRect(0, 0, this.width, this.height);

        ctx.textAlign = 'center';

        // タイトルロゴ
        ctx.fillStyle = '#00f5d4';
        ctx.font = '900 42px sans-serif';
        ctx.shadowColor = '#0077b6';
        ctx.shadowBlur = 12;
        ctx.fillText('FLY SHARK', this.width / 2, 230);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.shadowBlur = 0;
        ctx.fillText('フライシャーク', this.width / 2, 270);

        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#90e0ef';
        ctx.fillText('タップで泳ぎ上がって障害物を回避！', this.width / 2, 330);
        ctx.fillText('小魚を食べるとボーナス＋5点！', this.width / 2, 355);

        // スタートボタン風表示
        ctx.fillStyle = '#ff0054';
        ctx.beginPath();
        ctx.roundRect(this.width / 2 - 100, 430, 200, 50, 25);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('TAP TO START', this.width / 2, 462);

        ctx.restore();
    }

    drawGameOverScreen() {
        const ctx = this.ctx;
        ctx.save();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, this.width, this.height);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(40, 200, 320, 300, 24);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff0054';
        ctx.font = '900 34px sans-serif';
        ctx.fillText('GAME OVER', this.width / 2, 260);

        ctx.fillStyle = '#03045e';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(`SCORE : ${this.score}`, this.width / 2, 320);

        ctx.fillStyle = '#ffb703';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`食べた魚 : ${this.fishEaten} 匹`, this.width / 2, 355);

        ctx.fillStyle = '#0077b6';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`BEST SCORE : ${this.bestScore}`, this.width / 2, 385);

        // リトライボタン
        ctx.fillStyle = '#38b000';
        ctx.beginPath();
        ctx.roundRect(this.width / 2 - 85, 420, 170, 46, 23);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('RETRY', this.width / 2, 449);

        ctx.restore();
    }

    render() {
        this.drawBackground();

        // ゲームオブジェクトの描画
        this.obstacles.forEach(o => o.draw(this.ctx, this.height));
        this.fishes.forEach(f => f.draw(this.ctx));
        this.shark.draw(this.ctx);
        this.particles.forEach(p => p.draw(this.ctx));

        if (this.state === 'PLAYING') {
            this.drawHUD();
        } else if (this.state === 'TITLE') {
            this.drawTitleScreen();
        } else if (this.state === 'GAMEOVER') {
            this.drawHUD();
            this.drawGameOverScreen();
        }
    }

    loop(timestamp) {
        const dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;

        this.update(dt);
        this.render();

        requestAnimationFrame((t) => this.loop(t));
    }
}

window.addEventListener('load', () => {
    new Game();
});
</script>
</body>
</html>
